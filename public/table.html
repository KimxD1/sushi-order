<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<title>테이블 주문</title>
<link rel="stylesheet" href="/css/common.css">
<style>
  html, body { height: 100%; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .t-header {
    flex: none; position: relative; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: clamp(10px, 2vh, 18px) clamp(14px, 2.4vw, 28px);
  }
  .t-brand { display: flex; align-items: center; gap: 14px; }
  .t-logo { flex: none; width: clamp(42px, 6.5vh, 52px); height: clamp(42px, 6.5vh, 52px); border-radius: 16px; background: var(--primary); display: grid; place-items: center; font-size: 28px; box-shadow: 0 6px 16px rgba(255, 107, 74, .35); }
  .t-shop { font-size: 15px; font-weight: 600; color: var(--text3); }
  .t-table { font-size: clamp(20px, 3.4vh, 26px); font-weight: 800; letter-spacing: -0.03em; }
  .t-actions { display: flex; gap: 10px; align-items: center; }
  .t-actions .fs-btn { height: clamp(44px, 6.5vh, 52px); min-width: clamp(44px, 6.5vh, 52px); }
  .pill { height: clamp(44px, 6.5vh, 52px); padding: 0 clamp(12px, 1.6vw, 20px); white-space: nowrap; border-radius: 16px; background: #fff; font-size: 17px; font-weight: 700; color: var(--text2); display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
  .pill .badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--primary); color: #fff; font-size: 14px; display: grid; place-items: center; }
  .pill.hold { position: relative; overflow: hidden; background: var(--mint); color: #fff; touch-action: none; transition: transform .2s var(--ease), opacity .3s; }
  .pill.hold[hidden] { display: none; }
  .pill.hold .fill { position: absolute; inset: 0; background: #0B8F67; transform: scaleX(0); transform-origin: left; }
  .pill.hold.holding .fill { transform: scaleX(1); transition: transform 1.5s linear; }
  .pill.hold.holding { transform: scale(.96); }
  .pill.hold .lbl { position: relative; }
  .hold-tip { position: fixed; z-index: 70; background: var(--text); color: #fff; font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 12px; pointer-events: none; animation: toastIn .4s var(--spring) both; }
  .pill .badge.zero { background: var(--line); color: var(--text3); }

  main { flex: 1; min-height: 0; width: 100%; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column;
    padding: 0 clamp(14px, 2.4vw, 28px) calc(clamp(68px, 10vh, 84px) + clamp(28px, 4vh, 40px)); }
  .t-title { flex: none; font-size: clamp(22px, 4.2vh, 34px); font-weight: 800; margin: .4vh 0 .2vh; letter-spacing: -0.035em; }
  .t-subtitle { flex: none; font-size: clamp(14px, 2.2vh, 18px); color: var(--text3); margin: 0 0 clamp(10px, 2vh, 20px); font-weight: 500; }

  /* 메뉴 7개가 스크롤 없이 한 화면에: 가로 4×2, 세로 2×4 */
  .menu-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.8vh, 18px); }
  @media (orientation: portrait) { .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); } }
  .menu-card { position: relative; min-height: 0; display: flex; flex-direction: column; text-align: left; background: #fff; border-radius: clamp(18px, 3vh, 26px); padding: clamp(8px, 1.3vh, 12px) clamp(8px, 1.3vh, 12px) clamp(10px, 1.8vh, 18px); box-shadow: var(--shadow); overflow: hidden; }
  .menu-card.in-cart { box-shadow: 0 0 0 3px var(--primary), var(--shadow); }
  .menu-img { position: relative; flex: 1; min-height: 0; border-radius: clamp(12px, 2.2vh, 20px); overflow: hidden; background: radial-gradient(circle at 50% 40%, #FFF8F3 0%, #FFE9DE 100%); }
  .menu-img .sushi-art { transition: transform .5s var(--spring); }
  .menu-card:active .menu-img .sushi-art { transform: scale(1.06) rotate(-2deg); }
  .menu-info { flex: none; padding: clamp(6px, 1.4vh, 14px) clamp(4px, .8vw, 8px) 0; padding-right: clamp(44px, 7vh, 60px); }
  .menu-name { font-size: clamp(16px, 2.9vh, 23px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; letter-spacing: -0.03em; }
  .menu-desc { font-size: clamp(12px, 1.9vh, 15px); color: var(--text3); margin-top: 2px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-price { font-size: clamp(15px, 2.6vh, 21px); font-weight: 800; color: var(--primary); margin-top: clamp(2px, .8vh, 10px); }
  .add-btn { position: absolute; right: clamp(10px, 1.8vh, 18px); bottom: clamp(10px, 1.8vh, 18px); width: clamp(36px, 6vh, 48px); height: clamp(36px, 6vh, 48px); border-radius: clamp(12px, 2vh, 16px); background: var(--primary-soft); color: var(--primary); font-size: 30px; font-weight: 600; display: grid; place-items: center; line-height: 1; }
  .qty-badge { position: absolute; top: 8px; right: 8px; min-width: clamp(30px, 5vh, 40px); height: clamp(30px, 5vh, 40px); padding: 0 8px; border-radius: 20px; background: var(--primary); color: #fff; font-size: 20px; font-weight: 800; display: grid; place-items: center; transform: scale(0); transition: transform .4s var(--spring); box-shadow: 0 4px 12px rgba(255, 107, 74, .4); }
  .menu-card.in-cart .qty-badge { transform: scale(1); }
  .soldout-mask { position: absolute; inset: 0; background: rgba(255, 255, 255, .72); display: none; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--text2); }
  .menu-card.soldout .soldout-mask { display: flex; }
  .menu-card.soldout { pointer-events: none; }

  /* 하단 장바구니 바 */
  .cartbar-slot { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 clamp(14px, 2.4vw, 28px) calc(clamp(14px, 2.4vh, 24px) + env(safe-area-inset-bottom)); z-index: 60; pointer-events: none; display: flex; justify-content: center; }
  .cartbar {
    pointer-events: auto; width: min(760px, 100%); height: clamp(68px, 10vh, 84px); border-radius: 24px; background: var(--primary); color: #fff;
    display: flex; align-items: center; padding: 0 12px 0 24px; gap: 16px; box-shadow: 0 12px 32px rgba(255, 107, 74, .45);
    transform: translateY(160%); transition: transform .55s var(--spring);
  }
  .cartbar.show { transform: translateY(0); }
  .cartbar:active { transform: scale(.98); }
  .cb-icon { position: relative; font-size: 34px; }
  .cb-count { position: absolute; top: -6px; right: -12px; min-width: 26px; height: 26px; border-radius: 13px; background: #fff; color: var(--primary); font-size: 15px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
  .cb-text { flex: 1; text-align: left; }
  .cb-text small { display: block; font-size: 15px; opacity: .85; font-weight: 600; }
  .cb-text b { font-size: clamp(21px, 3.4vh, 26px); font-weight: 800; }
  .cb-go { height: clamp(50px, 7.4vh, 60px); padding: 0 28px; border-radius: 18px; background: #fff; color: var(--primary); font-size: 21px; font-weight: 800; display: grid; place-items: center; }

  /* 장바구니 시트 */
  .cart-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line2); }
  .cart-row .thumb { width: 84px; height: 62px; border-radius: 14px; overflow: hidden; background: #FFF3EC; flex: none; }
  .cart-row .nm { flex: 1; }
  .cart-row .nm b { display: block; font-size: 20px; font-weight: 800; }
  .cart-row .nm span { font-size: 16px; color: var(--text3); font-weight: 600; }
  .stepper { display: flex; align-items: center; background: var(--line2); border-radius: 14px; height: 50px; }
  .stepper button { width: 50px; height: 50px; font-size: 26px; font-weight: 600; color: var(--text2); border-radius: 14px; }
  .stepper button:active { background: var(--line); }
  .stepper span { min-width: 34px; text-align: center; font-size: 20px; font-weight: 800; }
  .sheet-total { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0; }
  .sheet-total span { font-size: 19px; color: var(--text2); font-weight: 700; }
  .sheet-total b { font-size: 32px; font-weight: 800; color: var(--primary); }
  .sheet-btns { display: flex; gap: 10px; }
  .sheet-btns .btn.secondary { flex: 0 0 120px; }
  .sheet-btns .btn:last-child { flex: 1; }

  /* 내 주문 시트 */
  .my-order { position: relative; overflow: hidden; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 18px 18px 0; margin-bottom: 14px; touch-action: pan-y; transition: transform .2s var(--ease), border-color .2s; -webkit-touch-callout: none; }
  .my-order .cfill { position: absolute; inset: 0; background: var(--red-soft); transform: scaleX(0); transform-origin: left; pointer-events: none; }
  .my-order.holding { border-color: var(--red); transform: scale(.98); }
  .my-order.holding .cfill { transform: scaleX(1); transition: transform 1.5s linear; }
  .my-order > *:not(.cfill) { position: relative; }
  .my-order .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .my-order .top b { font-size: 18px; }
  .my-order .items { font-size: 17px; color: var(--text2); font-weight: 600; line-height: 1.5; }
  .my-order .hint { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 14px -18px 0; padding: 12px; border-top: 1px dashed var(--line); font-size: 15px; font-weight: 700; color: var(--text3); }
  .my-order.holding .hint { color: var(--red); }
  .my-order.gone { animation: goneOut .45s var(--ease) forwards; }
  @keyframes goneOut { to { opacity: 0; transform: translateX(40px) scale(.95); } }
  .my-order .sum { margin-top: 6px; font-size: 18px; font-weight: 800; color: var(--primary); text-align: right; }
  .my-total { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 0; }
  .my-total span { font-size: 18px; font-weight: 700; color: var(--text2); }
  .my-total b { font-size: 28px; font-weight: 800; }

  /* 전체화면 오버레이 */
  .overlay { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; align-items: center; justify-content: center; padding: 32px; opacity: 0; visibility: hidden; transition: opacity .35s var(--ease), visibility .35s; }
  .overlay.show { opacity: 1; visibility: visible; }
  .ov-inner { width: min(620px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; }
  .ov-step { font-size: 17px; font-weight: 800; color: var(--primary); background: var(--primary-soft); padding: 8px 16px; border-radius: 10px; }
  .ov-title { font-size: 38px; font-weight: 800; line-height: 1.3; margin: 18px 0 8px; letter-spacing: -0.04em; }
  .ov-desc { font-size: 19px; color: var(--text3); font-weight: 500; }

  .done-no { font-size: 22px; font-weight: 800; background: var(--mint-soft); color: var(--mint); padding: 10px 18px; border-radius: 12px; margin-top: 18px; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; z-index: 1001; pointer-events: none; }

  /* 세로 태블릿: 카드 안에서 그림 왼쪽 · 글자 오른쪽 */
  @media (orientation: portrait) {
    .menu-card { flex-direction: row; align-items: stretch; gap: clamp(8px, 1.4vw, 14px); padding: clamp(8px, 1.2vh, 12px); }
    .menu-img { flex: 0 0 48%; }
    .menu-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; padding: clamp(4px, 1vh, 10px) 0 clamp(46px, 7vh, 62px); }
    .menu-name { white-space: normal; word-break: keep-all; line-height: 1.25; }
    .add-btn { right: clamp(10px, 1.4vh, 14px); bottom: clamp(10px, 1.4vh, 14px); }
  }

  /* 작은 세로 화면: + 버튼 숨기기 (카드 어디를 눌러도 담겨요) */
  @media (orientation: portrait) and (max-width: 700px) {
    .add-btn { display: none; }
    .menu-info { justify-content: center; padding: 0; }
    .menu-name { font-size: clamp(15px, 2.2vh, 19px); }
  }

  /* 작은 화면 / 낮은 화면 */
  @media (max-height: 680px), (orientation: portrait) and (max-width: 700px) { .menu-desc { display: none; } }
  @media (max-width: 700px) {
    .t-shop { display: none; } .pill { font-size: 15px; }
    .ov-title { font-size: 30px; }
  }
  @media (max-height: 640px) { .t-subtitle { display: none; } .ov-title { font-size: 30px; margin: 10px 0 6px; } .check-circle { width: 96px; height: 96px; } }
</style>
</head>
<body>
  <header class="t-header">
    <div class="t-brand">
      <div class="t-logo">🍣</div>
      <div><div class="t-shop" id="shopName">꼬마 초밥집</div><div class="t-table" id="tableName">테이블 1</div></div>
    </div>
    <div class="t-actions">
      <button class="pill hold" id="btnDone" data-nosound><span class="fill"></span><span class="lbl">🍽️ 다 먹었어요</span></button>
      <button class="pill press" id="btnMyOrders">🧾 내 주문 <span class="badge zero" id="myOrderCount">0</span></button>
    </div>
  </header>

  <main>
    <h1 class="t-title">어떤 초밥을 먹을까요?</h1>
    <p class="t-subtitle">먹고 싶은 초밥을 눌러서 담아 주세요</p>
    <div class="menu-grid" id="menuGrid"></div>
  </main>

  <div class="cartbar-slot" id="cartSlot">
    <button class="cartbar" id="cartBar">
      <div class="cb-icon">🛒<span class="cb-count" id="cbCount">0</span></div>
      <div class="cb-text"><small>장바구니 보기</small><b id="cbTotal">0원</b></div>
      <div class="cb-go">주문하기</div>
    </button>
  </div>

  <div class="dim" id="dim"></div>

  <section class="sheet" id="cartSheet">
    <div class="grabber"></div>
    <h2>장바구니</h2>
    <div class="sub">개수를 확인하고 주문해 주세요</div>
    <div class="scroll" id="cartList"></div>
    <div class="sheet-total"><span>모두 합쳐서</span><b id="sheetTotal">0원</b></div>
    <div class="sheet-btns">
      <button class="btn secondary lg" id="btnClear" data-nosound>비우기</button>
      <button class="btn lg" id="btnOrder" data-nosound>주문하기</button>
    </div>
  </section>

  <section class="sheet" id="ordersSheet">
    <div class="grabber"></div>
    <h2>내 주문</h2>
    <div class="sub">취소하고 싶은 주문은 그 상자를 <b style="color:var(--red)">꾹</b> 눌러요</div>
    <div class="scroll" id="ordersList"></div>
    <button class="btn secondary lg block" id="btnOrdersClose" style="margin-top:14px">닫기</button>
  </section>

  <!-- 주문 완료 -->
  <section class="overlay" id="doneOverlay">
    <div class="ov-inner">
      <div id="doneCheck"></div>
      <div class="ov-title">주문 완료!<br>맛있게 만들어 줄게요</div>
      <div class="ov-desc">초밥이 다 되면 가져다 드릴게요</div>
      <div class="done-no" id="doneNo">주문번호 #001</div>
      <button class="btn lg" id="doneOk" style="margin-top:32px;width:260px">확인</button>
    </div>
  </section>

  <!-- 다 먹었어요 -->
  <section class="overlay" id="byeOverlay">
    <div class="ov-inner">
      <div style="font-size:96px" class="pop">😋</div>
      <div class="ov-title">맛있게 먹었어요!<br>또 놀러 오세요</div>
      <div class="ov-desc">테이블이 깨끗하게 비워졌어요</div>
    </div>
  </section>

  <script src="/js/sushi-art.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/table.js"></script>
</body>
</html>
